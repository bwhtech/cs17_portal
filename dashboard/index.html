<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CS17 Portal</title>
    <!-- Paint the saved scheme before the bundle runs, so a dark-mode user
         doesn't get a white flash on every load. Mirrors frappe-ui's
         `useColorScheme`: same `theme` key, same `data-theme` attribute. -->
    <script>
      try {
        var stored = localStorage.getItem("theme");
        var resolved =
          stored === "dark" || stored === "light"
            ? stored
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", resolved);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
